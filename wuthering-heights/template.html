<title>Wuthering Heights Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: a reading column beside a sticky notes panel (bottom sheet on narrow screens).
   Palette from the moors: stone paper, peat ink, heather accent; each note category has its own hue. */
:root {
  --paper: #f0f1ec;
  --panel: #e5e8e1;
  --raised: #fafbf8;
  --ink: #1d221f;
  --muted: #5b635c;
  --rule: #d1d6ce;
  --accent: #6b3e6e;
  --focus: #6b3e6e;
  --c-shift: #8c3a7b;
  --c-old: #36608f;
  --c-rural: #4a7537;
  --c-dialect: #9c5d17;
  --c-ref: #a13838;
  --c-name: #2b7774;
  --shadow: 0 10px 30px rgba(30, 34, 31, .18);
  --f-body: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-display: "Cormorant Garamond", "Literata", Georgia, serif;
  --text-size: 1.125rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151917; --panel: #1d2220; --raised: #232926; --ink: #e2e6df; --muted: #9aa39b;
    --rule: #2f3632; --accent: #c99fcd; --focus: #c99fcd;
    --c-shift: #d68dc6; --c-old: #8eb1e2; --c-rural: #9dc685; --c-dialect: #e2aa60; --c-ref: #e88c8c; --c-name: #79c8c3;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151917; --panel: #1d2220; --raised: #232926; --ink: #e2e6df; --muted: #9aa39b;
  --rule: #2f3632; --accent: #c99fcd; --focus: #c99fcd;
  --c-shift: #d68dc6; --c-old: #8eb1e2; --c-rural: #9dc685; --c-dialect: #e2aa60; --c-ref: #e88c8c; --c-name: #79c8c3;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }

/* ---------- header ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-inner { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; line-height: 1.15; margin-right: auto; min-width: 0; }
.brand b { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 1.45rem; letter-spacing: .01em; }
.brand span { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
select#chapter {
  appearance: none; border: 1px solid var(--rule); background: var(--raised); border-radius: 6px;
  padding: 6px 30px 6px 10px; font-weight: 500; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat;
}
.btn {
  border: 1px solid var(--rule); background: var(--raised); border-radius: 6px; padding: 6px 10px;
  cursor: pointer; font-weight: 500; line-height: 1.2;
}
.btn:hover { border-color: var(--muted); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.size { display: inline-flex; }
.size .btn { border-radius: 0; font-family: var(--f-body); min-width: 34px; }
.size .btn:first-child { border-radius: 6px 0 0 6px; }
.size .btn:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
#listBtn { display: none; }

/* ---------- main grid ---------- */
.wrap {
  max-width: 1180px; margin: 0 auto;
  display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 48px;
  padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { min-width: 0; }
.reader { max-width: 38rem; margin: 0 auto; }

.chap-head { text-align: center; margin: 8px 0 26px; }
.chap-head .vol { margin-top: 10px; font-size: .75rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.chap-head h1 { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 3.4rem; line-height: 1; margin: 6px 0 0; text-wrap: balance; }
.chap-head h1 small { display: block; font-family: var(--f-ui); font-style: normal; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }

.orient {
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  padding: 12px 2px; margin: 0 0 28px; color: var(--muted); font-size: .9rem;
  display: grid; grid-template-columns: auto 1fr; gap: 4px 12px;
}
.orient dt { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; padding-top: 2px; color: var(--ink); }
.orient dd { margin: 0; }

.text { font-family: var(--f-body); font-size: var(--text-size); line-height: 1.75; font-variant-ligatures: common-ligatures; hyphens: auto; }
.text p { margin: 0 0 1em; text-indent: 1.4em; }
.text p:first-child { text-indent: 0; }
.text p.dropcap::first-letter { font-family: var(--f-display); font-style: italic; font-size: 3.3em; float: left; line-height: .8; padding: .08em .08em 0 0; color: var(--accent); }

/* annotated words */
.w {
  --c: var(--accent);
  cursor: pointer; border-radius: 2px;
  text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--c) 70%, transparent);
  text-decoration-thickness: 2px; text-underline-offset: .22em; text-decoration-skip-ink: none;
  transition: background-color .15s;
  hyphens: manual; scroll-margin-top: 150px;
}
.w:hover { background: color-mix(in srgb, var(--c) 14%, transparent); }
.w.active { background: color-mix(in srgb, var(--c) 24%, transparent); text-decoration-color: var(--c); }
.w.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 30% { background: color-mix(in srgb, var(--c) 45%, transparent); } 100% { background: transparent; } }
.w[data-c="shift"] { --c: var(--c-shift); text-decoration-style: wavy; text-decoration-thickness: 1.5px; }
.w[data-c="old"] { --c: var(--c-old); }
.w[data-c="rural"] { --c: var(--c-rural); text-decoration-style: dashed; }
.w[data-c="dialect"] { --c: var(--c-dialect); text-decoration-style: double; }
.w[data-c="ref"] { --c: var(--c-ref); text-decoration-style: dotted; text-decoration-thickness: 2.5px; }
.w[data-c="name"] { --c: var(--c-name); text-decoration-style: dotted; text-decoration-thickness: 2.5px; }
.text.hide-shift .w[data-c="shift"], .text.hide-old .w[data-c="old"], .text.hide-rural .w[data-c="rural"],
.text.hide-dialect .w[data-c="dialect"], .text.hide-ref .w[data-c="ref"], .text.hide-name .w[data-c="name"] {
  text-decoration-color: transparent; cursor: text; background: none;
}
.pass {
  cursor: pointer; border-radius: 3px; padding: .05em .12em; margin: 0 -.12em;
  background: color-mix(in srgb, var(--c-dialect) 10%, transparent);
  -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: background-color .15s;
  scroll-margin-top: 150px;
}
.pass:hover { background: color-mix(in srgb, var(--c-dialect) 17%, transparent); }
.pass.active { background: color-mix(in srgb, var(--c-dialect) 26%, transparent); }
.pass.flash { animation: flashp 1.4s ease-out; }
@keyframes flashp { 0%, 30% { background: color-mix(in srgb, var(--c-dialect) 45%, transparent); } }
.pass-mark {
  font-family: var(--f-ui); font-size: .62em; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  color: var(--c-dialect); vertical-align: .35em; margin-left: .35em; white-space: nowrap; text-indent: 0;
}
.text.hide-dialect .pass { background: none; cursor: text; }
.text.hide-dialect .pass-mark { display: none; }
.text p.break { text-align: center; text-indent: 0; letter-spacing: .6em; color: var(--muted); margin: 1.4em 0; }
.note-word.quote { font-size: 1.05rem; font-weight: 400; font-style: italic; color: var(--muted); }
.note-word.quote b { font-style: normal; font-weight: 600; color: var(--ink); }
.text.plain .w { text-decoration-color: transparent; }
.text.plain .w:hover { text-decoration-color: color-mix(in srgb, var(--c) 70%, transparent); }

.chap-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--rule); }
.source { margin-top: 28px; font-size: .78rem; color: var(--muted); text-align: center; }
.source a { color: inherit; }

.empty { text-align: center; padding: 60px 0; color: var(--muted); font-family: var(--f-body); font-size: 1.05rem; }

/* ---------- notes panel ---------- */
aside {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px);
  max-height: calc(100vh - 100px); display: flex; flex-direction: column; gap: 16px; min-width: 0;
}
.card {
  background: var(--raised); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 18px 16px;
}
.card .hint { color: var(--muted); font-family: var(--f-body); font-size: 1rem; margin: 0; }
.card .hint b { font-weight: 600; color: var(--ink); }
.note-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.note-word { font-family: var(--f-body); font-size: 1.35rem; font-weight: 600; line-height: 1.25; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.chip {
  --c: var(--accent);
  display: inline-flex; align-items: center; gap: 6px; font-size: .7rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: .07em; color: var(--c); white-space: nowrap;
}
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.note-gloss { font-family: var(--f-body); font-size: 1.08rem; line-height: 1.5; margin: 10px 0 0; }
.note-modern {
  margin: 12px 0 0; padding: 8px 10px; border-radius: 6px; font-size: .85rem;
  background: color-mix(in srgb, var(--c-shift) 10%, transparent); border-left: 3px solid var(--c-shift);
}
.note-modern b { color: var(--c-shift); font-weight: 600; }
.note-more { margin: 12px 0 0; color: var(--muted); font-size: .9rem; line-height: 1.55; }
.note-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 8px; }
.note-nav .btn { padding: 4px 9px; font-size: .8rem; }
.note-nav .count { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.close { border: 0; background: none; cursor: pointer; font-size: 1.4rem; line-height: 1; padding: 0 4px; color: var(--muted); display: none; }

.list { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.list-head h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; margin: 0; }
.list-head span { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.filter {
  --c: var(--accent);
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--raised);
  border-radius: 999px; padding: 3px 10px 3px 8px; font-size: .78rem; cursor: pointer;
}
.filter::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.filter[aria-pressed="false"] { opacity: .45; }
.filter[aria-pressed="false"]::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.filter em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
#search {
  width: 100%; border: 1px solid var(--rule); background: var(--raised); border-radius: 6px; padding: 7px 10px; margin-bottom: 8px;
}
#search::placeholder { color: var(--muted); }
ol.items { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; flex: 1; border-top: 1px solid var(--rule); }
ol.items li button {
  --c: var(--accent);
  display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 2px 10px; align-items: baseline;
  width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule);
  padding: 7px 4px; cursor: pointer;
}
ol.items li button:hover { background: var(--panel); }
ol.items li button.active { background: color-mix(in srgb, var(--c) 12%, transparent); }
ol.items li button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); align-self: center; grid-row: span 2; }
ol.items li button b { font-family: var(--f-body); font-weight: 600; font-size: .95rem; overflow-wrap: anywhere; }
ol.items li button span { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.items .none { padding: 14px 4px; color: var(--muted); }

[data-c="shift"] { --c: var(--c-shift); }
[data-c="old"] { --c: var(--c-old); }
[data-c="rural"] { --c: var(--c-rural); }
[data-c="dialect"] { --c: var(--c-dialect); }
[data-c="ref"] { --c: var(--c-ref); }
[data-c="name"] { --c: var(--c-name); }

/* ---------- narrow: notes become a bottom sheet ---------- */
@media (max-width: 900px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 0; padding-bottom: 50vh; }
  #listBtn { display: inline-block; }
  .chap-head h1 { font-size: 2.8rem; }
  aside {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 25;
    max-height: 62vh; gap: 0;
    background: var(--raised); border-top: 1px solid var(--rule); box-shadow: var(--shadow);
    border-radius: 14px 14px 0 0;
    padding-block: 6px calc(14px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    transform: translateY(105%); transition: transform .25s ease; visibility: hidden;
  }
  aside.open { transform: none; visibility: visible; }
  aside::before { content: ""; width: 38px; height: 4px; border-radius: 4px; background: var(--rule); align-self: center; margin-bottom: 8px; flex: none; }
  aside .card { border: 0; padding: 4px 0 6px; background: none; }
  .close { display: block; }
  aside[data-mode="note"] .list { display: none; }
  aside[data-mode="list"] .card { display: none; }
  aside[data-mode="list"] .list { padding-top: 4px; }
  .list-head .close { display: block; }
}
@media (min-width: 901px) { .list-head .close { display: none; } }
@media (max-width: 480px) {
  .brand b { font-size: 1.2rem; }
  .size { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<header class="bar">
  <div class="bar-inner">
    <div class="brand"><b>Wuthering Heights</b><span>Emily Brontë · annotated companion</span></div>
    <div class="controls">
      <label for="chapter" hidden>Chapter</label>
      <select id="chapter" aria-label="Chapter"></select>
      <div class="size" role="group" aria-label="Text size">
        <button class="btn" id="smaller" type="button" aria-label="Smaller text">A−</button>
        <button class="btn" id="larger" type="button" aria-label="Larger text">A+</button>
      </div>
      <button class="btn" id="plainBtn" type="button" aria-pressed="false" title="Hide underlines until you hover">Quiet</button>
      <button class="btn" id="listBtn" type="button">Word list</button>
    </div>
  </div>
</header>

<div class="wrap">
  <main>
    <article class="reader" id="reader"></article>
  </main>
  <aside id="panel" data-mode="note" aria-label="Notes">
    <section class="card" id="card" aria-live="polite"></section>
    <section class="list">
      <div class="list-head"><h2>In this chapter</h2><span id="listCount"></span><button class="close" type="button" data-close aria-label="Close word list">×</button></div>
      <div class="filters" id="filters"></div>
      <input id="search" type="search" placeholder="Search words and meanings" aria-label="Search notes">
      <ol class="items" id="items"></ol>
    </section>
  </aside>
</div>

<script>
const CHAPTERS = /*__DATA__*/null;

const CATS = {
  shift:   { label: "Changed meaning", short: "Changed meaning" },
  old:     { label: "Old or literary word", short: "Old / literary" },
  rural:   { label: "Farm & country life", short: "Farm & country" },
  dialect: { label: "Yorkshire dialect", short: "Dialect" },
  ref:     { label: "Reference & context", short: "References" },
  name:    { label: "People & places", short: "People & places" },
};

const store = {
  get(k, d) { try { const v = localStorage.getItem("wh:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("wh:" + k, JSON.stringify(v)); } catch {} },
};

const $ = (s) => document.querySelector(s);
const reader = $("#reader"), panel = $("#panel"), card = $("#card"), items = $("#items");
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const isLetter = (ch) => !!ch && /\p{L}/u.test(ch);

const state = {
  ch: null,            // current chapter object
  order: [],           // note indices in order of first appearance
  active: null,        // active note index
  hidden: new Set(store.get("hidden", [])),
  query: "",
};

/* ---- annotate one paragraph ---- */
function annotate(raw, notes, used) {
  // strip _italic_ markers, remembering which characters were italic
  let plain = "", ital = [], on = false;
  for (const ch of raw) {
    if (ch === "_") { on = !on; continue; }
    plain += ch; ital.push(on);
  }
  // dialect passages: located by a start snippet and an end snippet
  const passes = [];
  notes.forEach((note, idx) => {
    if (!note.s || used.has(idx)) return;
    const a = plain.indexOf(note.s); if (a === -1) return;
    const b = plain.indexOf(note.e, a + note.s.length - Math.min(note.s.length, note.e.length)); if (b === -1) return;
    passes.push({ s: a, e: b + note.e.length, idx });
  });
  passes.sort((x, y) => x.s - y.s);
  const pChosen = [];
  for (const P of passes) { if (pChosen.length && P.s < pChosen[pChosen.length - 1].e) continue; pChosen.push(P); used.add(P.idx); }
  const crosses = (m) => pChosen.some((P) => m.s < P.e && m.e > P.s && !(m.s >= P.s && m.e <= P.e));

  const found = [];
  notes.forEach((note, idx) => {
    if (note.s) return;
    if (note.first && used.has(idx)) return;
    const forms = new Set([note.t]);
    const f = note.t[0];
    if (f && f.toLowerCase() !== f.toUpperCase()) forms.add((f === f.toLowerCase() ? f.toUpperCase() : f.toLowerCase()) + note.t.slice(1));
    for (const form of forms) {
      let at = plain.indexOf(form);
      while (at !== -1) {
        const end = at + form.length;
        const okStart = !isLetter(form[0]) || !isLetter(plain[at - 1]);
        const okEnd = !isLetter(form[form.length - 1]) || !isLetter(plain[end]);
        if (okStart && okEnd && !crosses({ s: at, e: end })) found.push({ s: at, e: end, idx });
        at = plain.indexOf(form, at + 1);
      }
    }
  });
  found.sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
  const chosen = [];
  let cursor = 0;
  for (const m of found) {
    if (m.s < cursor) continue;
    if (notes[m.idx].first && used.has(m.idx)) continue;
    chosen.push(m); cursor = m.e; used.add(m.idx);
  }
  const span = (a, b) => {
    let out = "", cur = false;
    for (let i = a; i < b; i++) {
      if (ital[i] !== cur) { out += ital[i] ? "<em>" : "</em>"; cur = ital[i]; }
      out += esc(plain[i]);
    }
    return out + (cur ? "</em>" : "");
  };
  const words = (a, b) => {
    let html = "", pos = a;
    for (const m of chosen) {
      if (m.s < a || m.e > b) continue;
      html += span(pos, m.s) + `<span class="w" data-n="${m.idx}" data-c="${notes[m.idx].c}" role="button" tabindex="0">${span(m.s, m.e)}</span>`;
      pos = m.e;
    }
    return html + span(pos, b);
  };
  let html = "", pos = 0;
  for (const P of pChosen) {
    html += words(pos, P.s) + `<span class="pass" data-n="${P.idx}" role="button" tabindex="0" aria-label="Show this speech in plain English">${words(P.s, P.e)}<span class="pass-mark" aria-hidden="true">in English</span></span>`;
    pos = P.e;
  }
  html += words(pos, plain.length);
  const hits = [...pChosen, ...chosen].sort((x, y) => x.s - y.s || (y.e - y.s) - (x.e - x.s)).map((m) => m.idx);
  return { html, hits };
}

/* ---- chapter rendering ---- */
function renderChapter(n) {
  const ch = CHAPTERS.find((c) => c.n === n) || CHAPTERS[0];
  state.ch = ch; state.active = null; state.order = [];
  store.set("chapter", ch.n);
  $("#chapter").value = String(ch.n);
  if (location.hash !== "#chapter-" + ch.n) history.replaceState(null, "", "#chapter-" + ch.n);

  const head = `<header class="chap-head"><h1><small>Chapter</small>${ch.roman}</h1>${ch.n > 14 ? `<div class="vol">Volume II, Chapter ${ch.vol.split(" ").pop()} in two-volume editions</div>` : ""}</header>`;
  if (!ch.paras) {
    reader.innerHTML = head + `<p class="empty">Chapter ${ch.roman} hasn't been annotated yet.<br>Chapters ready so far: ${CHAPTERS.filter((c) => c.paras).map((c) => c.roman).join(", ")}.</p>` + navHTML(ch);
    renderList(); renderCard(); return;
  }
  const used = new Set(), seen = new Set();
  const paras = ch.paras.map((p, i) => {
    if (/^(\*\s*)+$/.test(p)) return `<p class="break" aria-hidden="true">* * *</p>`;
    const r = annotate(p, ch.notes, used);
    r.hits.forEach((i) => { if (!seen.has(i)) { seen.add(i); state.order.push(i); } });
    return `<p${i === 0 && /^\p{L}/u.test(p) ? ' class="dropcap"' : ""}>${r.html}</p>`;
  }).join("");
  const missing = ch.notes.map((_, i) => i).filter((i) => !seen.has(i));
  if (missing.length) console.warn("Notes not matched in text:", missing.map((i) => ch.notes[i].t));
  const orient = ch.orient ? `<dl class="orient"><dt>Where we are</dt><dd>${esc(ch.orient)}</dd></dl>` : "";
  reader.innerHTML = head + orient + `<div class="text" id="text">${paras}</div>` + navHTML(ch) +
    `<p class="source">Text: Project Gutenberg eBook #768 (public domain). Notes written for this companion.</p>`;
  applyHidden(); applyPlain();
  renderList(); renderCard();
  window.scrollTo({ top: 0 });
}

function navHTML(ch) {
  const prev = CHAPTERS.find((c) => c.n === ch.n - 1), next = CHAPTERS.find((c) => c.n === ch.n + 1);
  return `<nav class="chap-nav">${prev ? `<button class="btn" type="button" data-go="${prev.n}">← Chapter ${prev.roman}</button>` : "<span></span>"}` +
    `${next ? `<button class="btn" type="button" data-go="${next.n}">Chapter ${next.roman} →</button>` : "<span></span>"}</nav>`;
}

/* ---- notes card ---- */
function renderCard() {
  const ch = state.ch;
  if (state.active == null || !ch.notes) {
    card.innerHTML = `<p class="hint"><b>Tap any underlined word</b> to see what it means here. The underline style shows the kind of note: <span style="text-decoration:underline wavy var(--c-shift);text-underline-offset:.2em">wavy</span> means the word has changed meaning since 1847. <span style="background:color-mix(in srgb,var(--c-dialect) 14%,transparent);padding:0 .2em;border-radius:3px">Shaded speeches</span> are in Yorkshire dialect: tap one to read it in plain English.</p>`;
    return;
  }
  const note = ch.notes[state.active];
  const pos = state.order.indexOf(state.active);
  const navRow = `
    <div class="note-nav">
      <button class="btn" type="button" data-step="-1" ${pos <= 0 ? "disabled" : ""}>← Previous</button>
      <span class="count">${pos + 1} of ${state.order.length}</span>
      <button class="btn" type="button" data-step="1" ${pos >= state.order.length - 1 ? "disabled" : ""}>Next →</button>
    </div>`;
  if (note.s) {
    card.innerHTML = `
      <div class="note-top">
        <span class="chip" data-c="dialect">Dialect speech in plain English</span>
        <button class="close" type="button" data-close aria-label="Close note">×</button>
      </div>
      <h2 class="note-word quote">${note.who ? `<b>${esc(note.who)}:</b> ` : ""}“${esc(note.s.replace(/^[“‘]+/, ""))}…”</h2>
      <p class="note-gloss">${esc(note.tr)}</p>
      ${note.n ? `<p class="note-more">${esc(note.n)}</p>` : ""}${navRow}`;
    return;
  }
  card.innerHTML = `
    <div class="note-top">
      <span class="chip" data-c="${note.c}">${CATS[note.c]?.label || note.c}</span>
      <button class="close" type="button" data-close aria-label="Close note">×</button>
    </div>
    <h2 class="note-word">${esc(note.t.replace(/[“”]/g, ""))}</h2>
    <p class="note-gloss">${esc(note.g)}</p>
    ${note.m ? `<p class="note-modern"><b>Watch out:</b> ${esc(note.m)}</p>` : ""}
    ${note.n ? `<p class="note-more">${esc(note.n)}</p>` : ""}
    <div class="note-nav">
      <button class="btn" type="button" data-step="-1" ${pos <= 0 ? "disabled" : ""}>← Previous</button>
      <span class="count">${pos + 1} of ${state.order.length}</span>
      <button class="btn" type="button" data-step="1" ${pos >= state.order.length - 1 ? "disabled" : ""}>Next →</button>
    </div>`;
}

function activate(idx, { scroll = false, open = true } = {}) {
  state.active = idx;
  document.querySelectorAll("#text .active").forEach((el) => el.classList.remove("active"));
  const els = document.querySelectorAll(`#text [data-n="${idx}"]`);
  els.forEach((el) => el.classList.add("active"));
  if (scroll && els[0]) {
    els[0].scrollIntoView({ block: matchMedia("(max-width: 900px)").matches ? "start" : "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    els[0].classList.remove("flash"); void els[0].offsetWidth; els[0].classList.add("flash");
  }
  renderCard(); markListActive();
  if (open) { panel.dataset.mode = "note"; panel.classList.add("open"); }
}

/* ---- word list ---- */
function renderFilters() {
  const ch = state.ch;
  const counts = {};
  (ch.notes || []).forEach((n, i) => { if (state.order.includes(i)) counts[n.c] = (counts[n.c] || 0) + 1; });
  $("#filters").innerHTML = Object.entries(CATS).map(([k, v]) =>
    `<button class="filter" type="button" data-c="${k}" data-filter="${k}" aria-pressed="${!state.hidden.has(k)}">${v.short} <em>${counts[k] || 0}</em></button>`).join("");
}

function renderList() {
  renderFilters();
  const ch = state.ch;
  if (!ch.notes) { items.innerHTML = `<li class="none">No notes for this chapter yet.</li>`; $("#listCount").textContent = ""; return; }
  const q = state.query.trim().toLowerCase();
  const shown = state.order.filter((i) => {
    const n = ch.notes[i];
    if (state.hidden.has(n.c)) return false;
    if (!q) return true;
    return [n.t, n.g, n.m, n.n, n.s, n.tr, n.who].some((s) => s && s.toLowerCase().includes(q));
  });
  $("#listCount").textContent = `${shown.length} of ${state.order.length}`;
  items.innerHTML = shown.length ? shown.map((i) => {
    const n = ch.notes[i];
    const label = n.s ? `${n.who ? n.who + ": " : ""}“${n.s.replace(/^[“‘]+/, "")}…”` : n.t.replace(/[“”]/g, "");
    return `<li><button type="button" data-c="${n.c}" data-jump="${i}"><i></i><b>${esc(label)}</b><span>${esc(n.s ? n.tr : n.g)}</span></button></li>`;
  }).join("") : `<li class="none">Nothing matches.</li>`;
  markListActive();
}

function markListActive() {
  items.querySelectorAll("button.active").forEach((b) => b.classList.remove("active"));
  const b = items.querySelector(`button[data-jump="${state.active}"]`);
  if (b) { b.classList.add("active"); if (matchMedia("(min-width: 901px)").matches) b.scrollIntoView({ block: "nearest" }); }
}

function applyHidden() {
  const t = $("#text"); if (!t) return;
  Object.keys(CATS).forEach((k) => t.classList.toggle("hide-" + k, state.hidden.has(k)));
}
function applyPlain() {
  const on = store.get("plain", false);
  $("#plainBtn").setAttribute("aria-pressed", String(on));
  const t = $("#text"); if (t) t.classList.toggle("plain", on);
}

/* ---- text size ---- */
let size = store.get("size", 1.125);
function applySize() { document.documentElement.style.setProperty("--text-size", size + "rem"); store.set("size", size); }

/* ---- events ---- */
document.addEventListener("click", (e) => {
  const w = e.target.closest(".w");
  if (w) {
    const t = $("#text");
    if (t && t.classList.contains("hide-" + w.dataset.c)) return;
    activate(+w.dataset.n); return;
  }
  const ps = e.target.closest(".pass");
  if (ps) {
    const t = $("#text");
    if (t && t.classList.contains("hide-dialect")) return;
    activate(+ps.dataset.n); return;
  }
  const go = e.target.closest("[data-go]"); if (go) { renderChapter(+go.dataset.go); return; }
  const step = e.target.closest("[data-step]");
  if (step) { const pos = state.order.indexOf(state.active) + +step.dataset.step; if (state.order[pos] != null) activate(state.order[pos], { scroll: true }); return; }
  const jump = e.target.closest("[data-jump]");
  if (jump) { activate(+jump.dataset.jump, { scroll: true }); return; }
  const f = e.target.closest("[data-filter]");
  if (f) {
    const k = f.dataset.filter;
    state.hidden.has(k) ? state.hidden.delete(k) : state.hidden.add(k);
    store.set("hidden", [...state.hidden]); applyHidden(); renderList(); return;
  }
  if (e.target.closest("[data-close]")) { panel.classList.remove("open"); return; }
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && (e.target.classList?.contains("w") || e.target.classList?.contains("pass"))) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape") panel.classList.remove("open");
});
$("#chapter").addEventListener("change", (e) => renderChapter(+e.target.value));
$("#search").addEventListener("input", (e) => { state.query = e.target.value; renderList(); });
$("#listBtn").addEventListener("click", () => {
  const showing = panel.classList.contains("open") && panel.dataset.mode === "list";
  panel.dataset.mode = "list"; panel.classList.toggle("open", !showing);
});
$("#plainBtn").addEventListener("click", () => { store.set("plain", !store.get("plain", false)); applyPlain(); });
$("#smaller").addEventListener("click", () => { size = Math.max(.9, +(size - .0625).toFixed(4)); applySize(); });
$("#larger").addEventListener("click", () => { size = Math.min(1.6, +(size + .0625).toFixed(4)); applySize(); });
window.addEventListener("hashchange", () => { const m = location.hash.match(/^#chapter-(\d+)$/); if (m && +m[1] !== state.ch?.n) renderChapter(+m[1]); });

/* ---- boot ---- */
$("#chapter").innerHTML = CHAPTERS.map((c) => `<option value="${c.n}" ${c.paras ? "" : "disabled"}>Chapter ${c.roman}${c.paras ? "" : " · coming"}</option>`).join("");
applySize();
const fromHash = location.hash.match(/^#chapter-(\d+)$/);
const firstReady = (CHAPTERS.find((c) => c.paras) || CHAPTERS[0]).n;
let startN = fromHash ? +fromHash[1] : store.get("chapter", firstReady);
if (!CHAPTERS.find((c) => c.n === startN && c.paras)) startN = firstReady;
renderChapter(startN);
</script>
