rn!","c":"dialect","who":"Joseph","tr":"Master, master, he's stealing the lantern!"},{"t":"on the morrow","c":"old","g":"Tomorrow; the next day."},{"t":"postern","c":"old","g":"A small back or side gate."},{"t":"the ancient","c":"old","g":"The old man (Joseph)."},{"t":"holld him","c":"dialect","g":"Hold him! (Joseph setting the dogs on Lockwood.)"},{"t":"Gnasher","c":"name","first":true,"g":"One of the farm dogs.","n":"Like 'Wolf', a name chosen to sound fierce."},{"t":"guffaw","c":"old","g":"A loud, coarse laugh."},{"t":"copestone","c":"old","g":"The finishing touch.","n":"Literally, the top stone of a wall. Their laughter 'tops off' his humiliation."},{"t":"would suffer no resurrection","c":"old","g":"Would not let me get up.","m":"'Suffer' here means 'allow'."},{"t":"malignant","c":"old","g":"Spiteful, wicked."},{"t":"miscreants","c":"old","g":"Villains; wrongdoers."},{"t":"virulency","c":"old","g":"Bitterness, venom."},{"t":"smacked of King Lear","c":"ref","g":"Sounded like King Lear in Shakespeare's play.","n":"Lear, raging at his daughters, threatens terrible revenges but can't say what they will be. Lockwood's empty threats are just as vague."},{"t":"copious","c":"old","g":"Plentiful; a lot of."},{"t":"benevolent","c":"old","g":"Kind, well-meaning."},{"t":"my entertainer","c":"shift","g":"My host.","m":"Not a performer."},{"t":"stout housewife","c":"shift","g":"Sturdy woman who runs the household.","m":"'Stout' meant strong or sturdy (also plump); 'housewife' here means a housekeeper, not a married woman at home."},{"t":"vocal artillery","c":"old","g":"Her loud scolding (a joking military image)."},{"t":"agait","c":"dialect","g":"Going on; afoot. 'What you'll be up to next'."},{"t":"door-stones","c":"rural","g":"The stone doorstep."},{"t":"fair choking","c":"dialect","g":"Really choking.","n":"In Yorkshire speech 'fair' means 'completely, truly'."},{"t":"Wisht","c":"dialect","g":"Hush! Be quiet."},{"t":"mun’n’t","c":"dialect","g":"Mustn't."},{"t":"his habitual moroseness","c":"old","g":"His usual gloominess."},{"t":"perforce","c":"old","g":"Necessarily; because there was no choice."},{"t":"lodgings","c":"old","g":"A place to sleep."},{"t":"condoled","c":"old","g":"Sympathised."},{"t":"sorry predicament","c":"shift","g":"Miserable situation.","m":"'Sorry' here means pitiful or wretched, not apologetic."},{"t":"ushered","c":"old","g":"Showed the way; led."}]},{"n":3,"roman":"III","vol":"Volume I, Chapter III","paras":["While leading the way upstairs, she recommended that I should hide the candle, and not make a noise; for her master had an odd notion about the chamber she would put me in, and never let anybody lodge there willingly. I asked the reason. She did not know, she answered: she had only lived there a year or two; and they had so many queer goings on, she could not begin to be curious.","Too stupefied to be curious myself, I fastened my door and glanced round for the bed. The whole furniture consisted of a chair, a clothes-press, and a large oak case, with squares cut out near the top resembling coach windows. Having approached this structure, I looked inside, and perceived it to be a singular sort of old-fashioned couch, very conveniently designed to obviate the necessity for every member of the family having a room to himself. In fact, it formed a little closet, and the ledge of a window, which it enclosed, served as a table.","I slid back the panelled sides, got in with my light, pulled them together again, and felt secure against the vigilance of Heathcliff, and every one else.","The ledge, where I placed my candle, had a few mildewed books piled up in one corner; and it was covered with writing scratched on the paint. This writing, however, was nothing but a name repeated in all kinds of characters, large and small—_Catherine Earnshaw_, here and there varied to _Catherine Heathcliff_, and then again to _Catherine Linton_.","In vapid listlessness I leant my head against the window, and continued spelling over Catherine Earnshaw—Heathcliff—Linton, till my eyes closed; but they had not rested five minutes when a glare of white letters started from the dark, as vivid as spectres—the air swarmed with Catherines; and rousing myself to dispel the obtrusive name, I discovered my candle-wick reclining on one of the antique volumes, and perfuming the place with an odour of roasted calf-skin.","I snuffed it off, and, very ill at ease under the influence of cold and lingering nausea, sat up and spread open the injured tome on my knee. It was a Testament, in lean type, and smelling dreadfully musty: a fly-leaf bore the inscription—“Catherine Earnshaw, her book,” and a date some quarter of a century back.","I shut it, and took up another and another, till I had examined all. Catherine’s library was select, and its state of dilapidation proved it to have been well used, though not altogether for a legitimate purpose: scarcely one chapter had escaped a pen-and-ink commentary—at least the appearance of one—covering every morsel of blank that the printer had left. Some were detached sentences; other parts took the form of a regular diary, scrawled in an unformed, childish hand. At the top of an extra page (quite a treasure, probably, when first lighted on) I was greatly amused to behold an excellent caricature of my friend Joseph,—rudely, yet powerfully sketched. An immediate interest kindled within me for the unknown Catherine, and I began forthwith to decipher her faded hieroglyphics.","“An awful Sunday,” commenced the paragraph beneath. “I wish my father were back again. Hindley is a detestable substitute—his conduct to Heathcliff is atrocious—H. and I are going to rebel—we took our initiatory step this evening.","“All day had been flooding with rain; we could not go to church, so Joseph must needs get up a congregation in the garret; and, while Hindley and his wife basked downstairs before a comfortable fire—doing anything but reading their Bibles, I’ll answer for it—Heathcliff, myself, and the unhappy ploughboy were commanded to take our prayer-books, and mount: we were ranged in a row, on a sack of corn, groaning and shivering, and hoping that Joseph would shiver too, so that he might give us a short homily for his own sake. A vain idea! The service lasted precisely three hours; and yet my brother had the face to exclaim, when he saw us descending, ‘What, done already?’ On Sunday evenings we used to be permitted to play, if we did not make much noise; now a mere titter is sufficient to send us into corners.","“‘You forget you have a master here,’ says the tyrant. ‘I’ll demolish the first who puts me out of temper! I insist on perfect sobriety and silence. Oh, boy! was that you? Frances darling, pull his hair as you go by: I heard him snap his fingers.’ Frances pulled his hair heartily, and then went and seated herself on her husband’s knee, and there they were, like two babies, kissing and talking nonsense by the hour—foolish palaver that we should be ashamed of. We made ourselves as snug as our means allowed in the arch of the dresser. I had just fastened our pinafores together, and hung them up for a curtain, when in comes Joseph, on an errand from the stables. He tears down my handiwork, boxes my ears, and croaks:","“‘T’ maister nobbut just buried, and Sabbath not o’ered, und t’ sound o’ t’ gospel still i’ yer lugs, and ye darr be laiking! Shame on ye! sit ye down, ill childer! there’s good books eneugh if ye’ll read ’em: sit ye down, and think o’ yer sowls!’","“Saying this, he compelled us so to square our positions that we might receive from the far-off fire a dull ray to show us the text of the lumber he thrust upon us. I could not bear the employment. I took my dingy volume by the scroop, and hurled it into the dog-kennel, vowing I hated a good book. Heathcliff kicked his to the same place. Then there was a hubbub!","“‘Maister Hindley!’ shouted our chaplain. ‘Maister, coom hither! Miss Cathy’s riven th’ back off “Th’ Helmet o’ Salvation,” un’ Heathcliff’s pawsed his fit into t’ first part o’ “T’ Brooad Way to Destruction!” It’s fair flaysome that ye let ’em go on this gait. Ech! th’ owd man wad ha’ laced ’em properly—but he’s goan!’","“Hindley hurried up from his paradise on the hearth, and seizing one of us by the collar, and the other by the arm, hurled both into the back-kitchen; where, Joseph asseverated, ‘owd Nick’ would fetch us as sure as we were living: and, so comforted, we each sought a separate nook to await his advent. I reached this book, and a pot of ink from a shelf, and pushed the house-door ajar to give me light, and I have got the time on with writing for twenty minutes; but my companion is impatient, and proposes that we should appropriate the dairywoman’s cloak, and have a scamper on the moors, under its shelter. A pleasant suggestion—and then, if the surly old man come in, he may believe his prophecy verified—we cannot be damper, or colder, in the rain than we are here.”","* * * * * *","I suppose Catherine fulfilled her project, for the next sentence took up another subject: she waxed lachrymose.","“How little did I dream that Hindley would ever make me cry so!” she wrote. “My head aches, till I cannot keep it on the pillow; and still I can’t give over. Poor Heathcliff! Hindley calls him a vagabond, and won’t let him sit with us, nor eat with us any more; and, he says, he and I must not play together, and threatens to turn him out of the house if we break his orders. He has been blaming our father (how dared he?) for treating H. too liberally; and swears he will reduce him to his right place—”","* * * * * *","I began to nod drowsily over the dim page: my eye wandered from manuscript to print. I saw a red ornamented title—“Seventy Times Seven, and the First of the Seventy-First. A Pious Discourse delivered by the Reverend Jabez Branderham, in the Chapel of Gimmerden Sough.” And while I was, half-consciously, worrying my brain to guess what Jabez Branderham would make of his subject, I sank back in bed, and fell asleep. Alas, for the effects of bad tea and bad temper! What else could it be that made me pass such a terrible night? I don’t remember another that I can at all compare with it since I was capable of suffering.","I began to dream, almost before I ceased to be sensible of my locality. I thought it was morning; and I had set out on my way home, with Joseph for a guide. The snow lay yards deep in our road; and, as we floundered on, my companion wearied me with constant reproaches that I had not brought a pilgrim’s staff: telling me that I could never get into the house without one, and boastfully flourishing a heavy-headed cudgel, which I understood to be so denominated. For a moment I considered it absurd that I should need such a weapon to gain admittance into my own residence. Then a new idea flashed across me. I was not going there: we were journeying to hear the famous Jabez Branderham preach, from the text—“Seventy Times Seven;” and either Joseph, the preacher, or I had committed the “First of the Seventy-First,” and were to be publicly exposed and excommunicated.","We came to the chapel. I have passed it really in my walks, twice or thrice; it lies in a hollow, between two hills: an elevated hollow, near a swamp, whose peaty moisture is said to answer all the purposes of embalming on the few corpses deposited there. The roof has been kept whole hitherto; but as the clergyman’s stipend is only twenty pounds per annum, and a house with two rooms, threatening speedily to determine into one, no clergyman will undertake the duties of pastor: especially as it is currently reported that his flock would rather let him starve than increase the living by one penny from their own pockets. However, in my dream, Jabez had a full and attentive congregation; and he preached—good God! what a sermon; divided into _four hundred and ninety_ parts, each fully equal to an ordinary address from the pulpit, and each discussing a separate sin! Where he searched for them, I cannot tell. He had his private manner of interpreting the phrase, and it seemed necessary the brother should sin different sins on every occasion. They were of the most curious character: odd transgressions that I never imagined previously.","Oh, how weary I grew. How I writhed, and yawned, and nodded, and revived! How I pinched and pricked myself, and rubbed my eyes, and stood up, and sat down again, and nudged Joseph to inform me if he would _ever_ have done. I was condemned to hear all out: finally, he reached the “_First of the Seventy-First_.” At that crisis, a sudden inspiration descended on me; I was moved to rise and denounce Jabez Branderham as the sinner of the sin that no Christian need pardon.","“Sir,” I exclaimed, “sitting here within these four walls, at one stretch, I have endured and forgiven the four hundred and ninety heads of your discourse. Seventy times seven times have I plucked up my hat and been about to depart—Seventy times seven times have you preposterously forced me to resume my seat. The four hundred and ninety-first is too much. Fellow-martyrs, have at him! Drag him down, and crush him to atoms, that the place which knows him may know him no more!”","“_Thou art the Man!_” cried Jabez, after a solemn pause, leaning over his cushion. “Seventy times seven times didst thou gapingly contort thy visage—seventy times seven did I take counsel with my soul—Lo, this is human weakness: this also may be absolved! The First of the Seventy-First is come. Brethren, execute upon him the judgment written. Such honour have all His saints!”","With that concluding word, the whole assembly, exalting their pilgrim’s staves, rushed round me in a body; and I, having no weapon to raise in self-defence, commenced grappling with Joseph, my nearest and most ferocious assailant, for his. In the confluence of the multitude, several clubs crossed; blows, aimed at me, fell on other sconces. Presently the whole chapel resounded with rappings and counter rappings: every man’s hand was against his neighbour; and Branderham, unwilling to remain idle, poured forth his zeal in a shower of loud taps on the boards of the pulpit, which responded so smartly that, at last, to my unspeakable relief, they woke me. And what was it that had suggested the tremendous tumult? What had played Jabez’s part in the row? Merely the branch of a fir-tree that touched my lattice as the blast wailed by, and rattled its dry cones against the panes! I listened doubtingly an instant; detected the disturber, then turned and dozed, and dreamt again: if possible, still more disagreeably than before.","This time, I remembered I was lying in the oak closet, and I heard distinctly the gusty wind, and the driving of the snow; I heard, also, the fir bough repeat its teasing sound, and ascribed it to the right cause: but it annoyed me so much, that I resolved to silence it, if possible; and, I thought, I rose and endeavoured to unhasp the casement. The hook was soldered into the staple: a circumstance observed by me when awake, but forgotten. “I must stop it, nevertheless!” I muttered, knocking my knuckles through the glass, and stretching an arm out to seize the importunate branch; instead of which, my fingers closed on the fingers of a little, ice-cold hand!","The intense horror of nightmare came over me: I tried to draw back my arm, but the hand clung to it, and a most melancholy voice sobbed,","“Let me in—let me in!”","“Who are you?” I asked, struggling, meanwhile, to disengage myself.","“Catherine Linton,” it replied, shiveringly (why did I think of _Linton_? I had read _Earnshaw_ twenty times for Linton)—“I’m come home: I’d lost my way on the moor!”","As it spoke, I discerned, obscurely, a child’s face looking through the window. Terror made me cruel; and, finding it useless to attempt shaking the creature off, I pulled its wrist on to the broken pane, and rubbed it to and fro till the blood ran down and soaked the bedclothes: still it wailed, “Let me in!” and maintained its tenacious gripe, almost maddening me with fear.","“How can I!” I said at length. “Let _me_ go, if you want me to let you in!”","The fingers relaxed, I snatched mine through the hole, hurriedly piled the books up in a pyramid against it, and stopped my ears to exclude the lamentable prayer.","I seemed to keep them closed above a quarter of an hour; yet, the instant I listened again, there was the doleful cry moaning on!","“Begone!” I shouted. “I’ll never let you in, not if you beg for twenty years.”","“It is twenty years,” mourned the voice: “twenty years. I’ve been a waif for twenty years!”","Thereat began a feeble scratching outside, and the pile of books moved as if thrust forward.","I tried to jump up; but could not stir a limb; and so yelled aloud, in a frenzy of fright.","To my confusion, I discovered the yell was not ideal: hasty footsteps approached my chamber door; somebody pushed it open, with a vigorous hand, and a light glimmered through the squares at the top of the bed. I sat shuddering, yet, and wiping the perspiration from my forehead: the intruder appeared to hesitate, and muttered to himself.","At last, he said, in a half-whisper, plainly not expecting an answer,","“Is any one here?”","I considered it best to confess my presence; for I knew Heathcliff’s accents, and feared he might search further, if I kept quiet.","With this intention, I turned and opened the panels. I shall not soon forget the effect my action produced.","Heathcliff stood near the entrance, in his shirt and trousers; with a candle dripping over his fingers, and his face as white as the wall behind him. The first creak of the oak startled him like an electric shock: the light leaped from his hold to a distance of some feet, and his agitation was so extreme, that he could hardly pick it up.","“It is only your guest, sir,” I called out, desirous to spare him the humiliation of exposing his cowardice further. “I had the misfortune to scream in my sleep, owing to a frightful nightmare. I’m sorry I disturbed you.”","“Oh, God confound you, Mr. Lockwood! I wish you were at the—” commenced my host, setting the candle on a chair, because he found it impossible to hold it steady. “And who showed you up into this room?” he continued, crushing his nails into his palms, and grinding his teeth to subdue the maxillary convulsions. “Who was it? I’ve a good mind to turn them out of the house this moment!”","“It was your servant Zillah,” I replied, flinging myself on to the floor, and rapidly resuming my garments. “I should not care if you did, Mr. Heathcliff; she richly deserves it. I suppose that she wanted to get another proof that the place was haunted, at my expense. Well, it is—swarming with ghosts and goblins! You have reason in shutting it up, I assure you. No one will thank you for a doze in such a den!”","“What do you mean?” asked Heathcliff, “and what are you doing? Lie down and finish out the night, since you _are_ here; but, for Heaven’s sake! don’t repeat that horrid noise: nothing could excuse it, unless you were having your throat cut!”","“If the little fiend had got in at the window, she probably would have strangled me!” I returned. “I’m not going to endure the persecutions of your hospitable ancestors again. Was not the Reverend Jabez Branderham akin to you on the mother’s side? And that minx, Catherine Linton, or Earnshaw, or however she was called—she must have been a changeling—wicked little soul! She told me she had been walking the earth these twenty years: a just punishment for her mortal transgressions, I’ve no doubt!”","Scarcely were these words uttered when I recollected the association of Heathcliff’s with Catherine’s name in the book, which had completely slipped from my memory, till thus awakened. I blushed at my inconsideration: but, without showing further consciousness of the offence, I hastened to add—“The truth is, sir, I passed the first part of the night in—” Here I stopped afresh—I was about to say “perusing those old volumes,” then it would have revealed my knowledge of their written, as well as their printed, contents; so, correcting myself, I went on—“in spelling over the name scratched on that window-ledge. A monotonous occupation, calculated to set me asleep, like counting, or—”","“What _can_ you mean by talking in this way to _me!_” thundered Heathcliff with savage vehemence. “How—how _dare_ you, under my roof?—God! he’s mad to speak so!” And he struck his forehead with rage.","I did not know whether to resent this language or pursue my explanation; but he seemed so powerfully affected that I took pity and proceeded with my dreams; affirming I had never heard the appellation of “Catherine Linton” before, but reading it often over produced an impression which personified itself when I had no longer my imagination under control. Heathcliff gradually fell back into the shelter of the bed, as I spoke; finally sitting down almost concealed behind it. I guessed, however, by his irregular and intercepted breathing, that he struggled to vanquish an excess of violent emotion. Not liking to show him that I had heard the conflict, I continued my toilette rather noisily, looked at my watch, and soliloquised on the length of the night: “Not three o’clock yet! I could have taken oath it had been six. Time stagnates here: we must surely have retired to rest at eight!”","“Always at nine in winter, and rise at four,” said my host, suppressing a groan: and, as I fancied, by the motion of his arm’s shadow, dashing a tear from his eyes. “Mr. Lockwood,” he added, “you may go into my room: you’ll only be in the way, coming downstairs so early: and your childish outcry has sent sleep to the devil for me.”","“And for me, too,” I replied. “I’ll walk in the yard till daylight, and then I’ll be off; and you need not dread a repetition of my intrusion. I’m now quite cured of seeking pleasure in society, be it country or town. A sensible man ought to find sufficient company in himself.”","“Delightful company!” muttered Heathcliff. “Take the candle, and go where you please. I shall join you directly. Keep out of the yard, though, the dogs are unchained; and the house—Juno mounts sentinel there, and—nay, you can only ramble about the steps and passages. But, away with you! I’ll come in two minutes!”","I obeyed, so far as to quit the chamber; when, ignorant where the narrow lobbies led, I stood still, and was witness, involuntarily, to a piece of superstition on the part of my landlord which belied, oddly, his apparent sense. He got on to the bed, and wrenched open the lattice, bursting, as he pulled at it, into an uncontrollable passion of tears. “Come in! come in!” he sobbed. “Cathy, do come. Oh, do—_once_ more! Oh! my heart’s darling! hear me _this_ time, Catherine, at last!” The spectre showed a spectre’s ordinary caprice: it gave no sign of being; but the snow and wind whirled wildly through, even reaching my station, and blowing out the light.","There was such anguish in the gush of grief that accompanied this raving, that my compassion made me overlook its folly, and I drew off, half angry to have listened at all, and vexed at having related my ridiculous nightmare, since it produced that agony; though _why_ was beyond my comprehension. I descended cautiously to the lower regions, and landed in the back-kitchen, where a gleam of fire, raked compactly together, enabled me to rekindle my candle. Nothing was stirring except a brindled, grey cat, which crept from the ashes, and saluted me with a querulous mew.","Two benches, shaped in sections of a circle, nearly enclosed the hearth; on one of these I stretched myself, and Grimalkin mounted the other. We were both of us nodding ere any one invaded our retreat, and then it was Joseph, shuffling down a wooden ladder that vanished in the roof, through a trap: the ascent to his garret, I suppose. He cast a sinister look at the little flame which I had enticed to play between the ribs, swept the cat from its elevation, and bestowing himself in the vacancy, commenced the operation of stuffing a three-inch pipe with tobacco. My presence in his sanctum was evidently esteemed a piece of impudence too shameful for remark: he silently applied the tube to his lips, folded his arms, and puffed away. I let him enjoy the luxury unannoyed; and after sucking out his last wreath, and heaving a profound sigh, he got up, and departed as solemnly as he came.","A more elastic footstep entered next; and now I opened my mouth for a “good-morning,” but closed it again, the salutation unachieved; for Hareton Earnshaw was performing his orison _sotto voce_, in a series of curses directed against every object he touched, while he rummaged a corner for a spade or shovel to dig through the drifts. He glanced over the back of the bench, dilating his nostrils, and thought as little of exchanging civilities with me as with my companion the cat. I guessed, by his preparations, that egress was allowed, and, leaving my hard couch, made a movement to follow him. He noticed this, and thrust at an inner door with the end of his spade, intimating by an inarticulate sound that there was the place where I must go, if I changed my locality.","It opened into the house, where the females were already astir; Zillah urging flakes of flame up the chimney with a colossal bellows; and Mrs. Heathcliff, kneeling on the hearth, reading a book by the aid of the blaze. She held her hand interposed between the furnace-heat and her eyes, and seemed absorbed in her occupation; desisting from it only to chide the servant for covering her with sparks, or to push away a dog, now and then, that snoozled its nose overforwardly into her face. I was surprised to see Heathcliff there also. He stood by the fire, his back towards me, just finishing a stormy scene with poor Zillah; who ever and anon interrupted her labour to pluck up the corner of her apron, and heave an indignant groan.","“And you, you worthless—” he broke out as I entered, turning to his daughter-in-law, and employing an epithet as harmless as duck, or sheep, but generally represented by a dash—. “There you are, at your idle tricks again! The rest of them do earn their bread—you live on my charity! Put your trash away, and find something to do. You shall pay me for the plague of having you eternally in my sight—do you hear, damnable jade?”","“I’ll put my trash away, because you can make me if I refuse,” answered the young lady, closing her book, and throwing it on a chair. “But I’ll not do anything, though you should swear your tongue out, except what I please!”","Heathcliff lifted his hand, and the speaker sprang to a safer distance, obviously acquainted with its weight. Having no desire to be entertained by a cat-and-dog combat, I stepped forward briskly, as if eager to partake the warmth of the hearth, and innocent of any knowledge of the interrupted dispute. Each had enough decorum to suspend further hostilities: Heathcliff placed his fists, out of temptation, in his pockets; Mrs. Heathcliff curled her lip, and walked to a seat far off, where she kept her word by playing the part of a statue during the remainder of my stay. That was not long. I declined joining their breakfast, and, at the first gleam of dawn, took an opportunity of escaping into the free air, now clear, and still, and cold as impalpable ice.","My landlord halloed for me to stop ere I reached the bottom of the garden, and offered to accompany me across the moor. It was well he did, for the whole hill-back was one billowy, white ocean; the swells and falls not indicating corresponding rises and depressions in the ground: many pits, at least, were filled to a level; and entire ranges of mounds, the refuse of the quarries, blotted from the chart which my yesterday’s walk left pictured in my mind. I had remarked on one side of the road, at intervals of six or seven yards, a line of upright stones, continued through the whole length of the barren: these were erected and daubed with lime on purpose to serve as guides in the dark, and also when a fall, like the present, confounded the deep swamps on either hand with the firmer path: but, excepting a dirty dot pointing up here and there, all traces of their existence had vanished: and my companion found it necessary to warn me frequently to steer to the right or left, when I imagined I was following, correctly, the windings of the road.","We exchanged little conversation, and he halted at the entrance of Thrushcross Park, saying, I could make no error there. Our adieux were limited to a hasty bow, and then I pushed forward, trusting to my own resources; for the porter’s lodge is untenanted as yet. The distance from the gate to the Grange is two miles; I believe I managed to make it four, what with losing myself among the trees, and sinking up to the neck in snow: a predicament which only those who have experienced it can appreciate. At any rate, whatever were my wanderings, the clock chimed twelve as I entered the house; and that gave exactly an hour for every mile of the usual way from Wuthering Heights.","My human fixture and her satellites rushed to welcome me; exclaiming, tumultuously, they had completely given me up: everybody conjectured that I perished last night; and they were wondering how they must set about the search for my remains. I bid them be quiet, now that they saw me returned, and, benumbed to my very heart, I dragged upstairs; whence, after putting on dry clothes, and pacing to and fro thirty or forty minutes, to restore the animal heat, I adjourned to my study, feeble as a kitten: almost too much so to enjoy the cheerful fire and smoking coffee which the servant had prepared for my refreshment."],"orient":"Narrator: Lockwood, that same snowy night in 1801, stranded at Wuthering Heights. Part of the chapter is a diary scribbled in old books by a girl named Catherine about 25 years earlier, so for a while we hear her voice and step back into the past.","notes":[{"t":"the chamber","c":"old","g":"The bedroom."},{"t":"lodge there","c":"old","g":"Sleep or stay there."},{"t":"queer goings on","c":"shift","g":"Strange happenings.","m":"'Queer' simply meant odd or strange."},{"t":"stupefied","c":"old","g":"Dazed; unable to think clearly."},{"t":"clothes-press","c":"old","g":"A tall cupboard with shelves for storing clothes."},{"t":"large oak case","c":"rural","g":"A box-bed: a bed enclosed in a wooden cabinet with sliding panels.","n":"Common in old northern farmhouses. It kept out draughts and gave privacy in shared rooms. This one is built around a window."},{"t":"coach windows","c":"old","g":"The small windows in the door of a horse-drawn carriage."},{"t":"obviate the necessity","c":"old","g":"Remove the need."},{"t":"a little closet","c":"shift","g":"A small private enclosed space.","m":"Not a cupboard for clothes. A 'closet' was any small private room."},{"t":"Catherine Earnshaw","c":"name","first":true,"g":"A name scratched again and again on the window ledge.","n":"Lockwood has no idea who she is. Earnshaw is the family name of the house (remember the name over the door). The three surnames on the ledge will make sense as the story goes on."},{"t":"Catherine Linton","c":"name","first":true,"g":"A third version of the name, with a new surname: Linton.","n":"Keep an eye on this surname."},{"t":"vapid listlessness","c":"old","g":"Dull, drowsy boredom."},{"t":"spectres","c":"old","g":"Ghosts."},{"t":"obtrusive","c":"old","g":"Unpleasantly noticeable; intruding."},{"t":"roasted calf-skin","c":"old","g":"The smell of the book's leather cover burning.","n":"Books were bound in calf leather. His candle has fallen against one."},{"t":"snuffed it off","c":"old","g":"Pinched off the burning end of the wick."},{"t":"tome","c":"old","g":"A book, usually a large, heavy one."},{"t":"Testament","c":"ref","g":"A New Testament: the Christian part of the Bible."},{"t":"lean type","c":"old","g":"Thin, narrow printed letters."},{"t":"fly-leaf","c":"old","g":"The blank page at the very front of a book."},{"t":"Catherine Earnshaw, her book","c":"ref","g":"The traditional way of writing your name in a book you own."},{"t":"some quarter of a century back","c":"ref","g":"About 25 years earlier, so in the 1770s.","n":"Useful for the timeline: the diary comes from long before Lockwood's visit in 1801."},{"t":"select","c":"old","g":"Small but carefully chosen."},{"t":"dilapidation","c":"old","g":"Falling-apart, worn-out condition."},{"t":"legitimate purpose","c":"old","g":"Proper use (that is, for reading, not for scribbling in)."},{"t":"every morsel of blank","c":"old","g":"Every scrap of empty space on the page.","n":"Paper was expensive, so a child might write a diary in the margins of printed books."},{"t":"lighted on","c":"old","g":"Found by chance."},{"t":"caricature","c":"old","g":"A funny drawing that exaggerates someone's features."},{"t":"forthwith","c":"old","g":"Immediately."},{"t":"hieroglyphics","c":"old","g":"Hard-to-read writing (a joke comparing it to Egyptian picture-writing)."},{"t":"Hindley","c":"name","first":true,"g":"Catherine's brother. Her father is away, and Hindley is in charge.","n":"She calls him 'my brother' a little later."},{"t":"H. and I","c":"name","g":"H. = Heathcliff, here a boy and Catherine's companion.","n":"Remember the diary is about 25 years old, so this is Heathcliff as a child."},{"t":"initiatory step","c":"old","g":"First step."},{"t":"must needs","c":"old","g":"Had to; insisted on.","n":"Said a little scornfully: Joseph just had to do it."},{"t":"get up a congregation","c":"old","g":"Gather people for a church service."},{"t":"garret","c":"old","g":"An attic room just under the roof."},{"t":"I’ll answer for it","c":"old","g":"I'm sure of it; I bet."},{"t":"ploughboy","c":"rural","g":"A farm boy who leads the horses while ploughing."},{"t":"mount","c":"old","g":"Go upstairs."},{"t":"sack of corn","c":"shift","g":"A sack of grain (wheat, oats or barley).","m":"In British English 'corn' means grain in general, not maize."},{"t":"homily","c":"old","g":"A sermon; a moral talk."},{"t":"had the face to","c":"old","g":"Had the nerve to."},{"t":"titter","c":"old","g":"A nervous little giggle."},{"t":"the tyrant","c":"old","g":"Catherine's name for Hindley."},{"t":"sobriety","c":"shift","g":"Seriousness, solemn behaviour.","m":"Not only 'not being drunk'."},{"t":"Frances","c":"name","first":true,"g":"Hindley's wife."},{"t":"palaver","c":"old","g":"Silly, pointless chatter."},{"t":"pinafores","c":"old","g":"Children's aprons worn over their clothes."},{"t":"boxes my ears","c":"old","g":"Hits me on the side of the head."},{"s":"T’ maister nobbut just buried","e":"think o’ yer sowls!","c":"dialect","who":"Joseph","tr":"The master only just buried, the Sabbath not over, the sound of the gospel still in your ears, and you dare to be playing! Shame on you! Sit down, you bad children! There are good books enough if you'll read them. Sit down, and think about your souls!","n":"'The master' is Catherine's father. So the diary begins after his death; earlier she wrote 'I wish my father were back again'."},{"t":"Sabbath","c":"ref","g":"Sunday as a holy day of rest and worship.","n":"Strict Protestants like Joseph forbade play on Sundays."},{"t":"o’ered","c":"dialect","g":"Over; finished."},{"t":"lugs","c":"dialect","g":"Ears."},{"t":"laiking","c":"dialect","g":"Playing.","n":"From Old Norse 'leika', to play. 'Laik' is still heard in Yorkshire."},{"t":"ill childer","c":"dialect","g":"Bad children; wicked children."},{"t":"eneugh","c":"dialect","g":"Enough."},{"t":"sowls","c":"dialect","g":"Souls."},{"t":"the lumber","c":"shift","g":"The useless old junk (the dull religious books).","m":"In British English 'lumber' means unwanted old stuff, not timber."},{"t":"dingy volume","c":"old","g":"Dirty, drab-looking book."},{"t":"scroop","c":"dialect","g":"The spine or back cover of a book."},{"t":"dog-kennel","c":"rural","g":"The dogs' sleeping place, here inside the house."},{"t":"hubbub","c":"old","g":"A noisy commotion."},{"t":"our chaplain","c":"old","g":"Our private priest (Catherine mocking Joseph)."},{"s":"Maister, coom hither!","e":"but he’s goan!","c":"dialect","who":"Joseph","tr":"Master, come here! Miss Cathy's torn the back off 'The Helmet of Salvation', and Heathcliff's kicked his foot into the first part of 'The Broad Way to Destruction'! It's truly shocking that you let them carry on like this. Ugh! The old master would have given them a proper thrashing, but he's gone!"},{"t":"riven","c":"dialect","g":"Torn; ripped."},{"t":"Th’ Helmet o’ Salvation","c":"ref","g":"The title of a religious book (invented by Brontë).","n":"Joseph's books sound like real Puritan sermons of the time. 'The helmet of salvation' comes from the Bible (Ephesians 6:17)."},{"t":"pawsed his fit","c":"dialect","g":"Kicked his foot (through it)."},{"t":"T’ Brooad Way to Destruction","c":"ref","g":"'The Broad Way to Destruction': another religious book title.","n":"From Jesus's words that 'broad is the way, that leadeth to destruction' (Matthew 7:13)."},{"t":"this gait","c":"dialect","g":"This way; like this."},{"t":"th’ owd man","c":"dialect","g":"The old man: the late master, Catherine's father."},{"t":"laced","c":"dialect","g":"Beaten, thrashed."},{"t":"asseverated","c":"old","g":"Declared solemnly."},{"t":"owd Nick","c":"dialect","g":"Old Nick: the devil."},{"t":"advent","c":"old","g":"Arrival.","n":"Also a joke: 'Advent' is the season of waiting for Christ's coming, but they are waiting for the devil."},{"t":"got the time on","c":"old","g":"Passed the time."},{"t":"appropriate the dairywoman’s cloak","c":"rural","g":"Take (without asking) the cloak of the woman who works in the dairy.","n":"The dairywoman milked cows and made butter and cheese."},{"t":"scamper","c":"old","g":"A playful run."},{"t":"his prophecy verified","c":"old","g":"His prediction proved true.","n":"Joseph said the devil would come for them; if they vanish, he might think it happened."},{"t":"waxed lachrymose","c":"old","g":"Became tearful.","m":"'Wax' means 'grow, become' (as the moon waxes)."},{"t":"give over","c":"dialect","g":"Stop."},{"t":"vagabond","c":"old","g":"A homeless wanderer; a tramp."},{"t":"too liberally","c":"shift","g":"Too generously.","m":"Nothing to do with politics."},{"t":"manuscript to print","c":"old","g":"From the handwriting to the printed text."},{"t":"Seventy Times Seven","c":"ref","g":"From the Bible: how many times you must forgive.","n":"In Matthew 18:21–22, Peter asks Jesus if he should forgive someone seven times. Jesus says 'seventy times seven'. So the 'First of the Seventy-First' would be the 491st sin, the one beyond forgiveness."},{"t":"Jabez Branderham","c":"name","first":true,"g":"An invented preacher whose sermon title Lockwood reads just before falling asleep."},{"t":"Gimmerden Sough","c":"name","first":true,"g":"An invented local place name.","n":"'Sough' is a northern word for a boggy hollow or a drainage channel."},{"t":"sensible of my locality","c":"shift","g":"Aware of where I was.","m":"'Sensible of' means 'aware of', not 'reasonable'."},{"t":"pilgrim’s staff","c":"ref","g":"The walking stick carried by a religious pilgrim.","n":"In the dream Joseph insists Lockwood can't get home without one."},{"t":"cudgel","c":"old","g":"A short, thick club."},{"t":"so denominated","c":"old","g":"Called by that name."},{"t":"excommunicated","c":"ref","g":"Formally thrown out of the church."},{"t":"embalming","c":"old","g":"Preserving dead bodies from decay.","n":"Peat bogs really can preserve bodies for centuries."},{"t":"hitherto","c":"old","g":"Until now."},{"t":"stipend","c":"ref","g":"A clergyman's salary.","n":"Twenty pounds a year was very poor pay for a clergyman, even then."},{"t":"per annum","c":"old","g":"Latin: per year."},{"t":"determine into one","c":"shift","g":"End up as one (room).","m":"'Determine' here has an old sense of 'come to an end, end up'.","n":"A joke: the two-room house is falling down into one."},{"t":"his flock","c":"ref","g":"His congregation (a minister is a 'shepherd' of his 'flock')."},{"t":"the living","c":"ref","g":"A church post and the income that comes with it."},{"t":"four hundred and ninety","c":"ref","g":"Seventy times seven: 70 × 7 = 490."},{"t":"transgressions","c":"old","g":"Sins; wrongdoings."},{"t":"writhed","c":"old","g":"Twisted about in discomfort."},{"t":"heads of your discourse","c":"shift","g":"The main points or sections of your sermon.","m":"'Heads' are headings or divisions here."},{"t":"Fellow-martyrs, have at him!","c":"old","g":"Fellow sufferers, attack him!"},{"t":"the place which knows him may know him no more","c":"ref","g":"So he disappears completely.","n":"An echo of the Bible (Job 7:10; Psalm 103:16): a person's home will no longer know them after death."},{"t":"Thou art the Man!","c":"ref","g":"'You are the man!' From the Bible.","n":"The prophet Nathan's words when accusing King David of his sin (2 Samuel 12:7)."},{"t":"didst thou gapingly contort thy visage","c":"old","g":"Did you twist your face in yawns.","n":"'Visage' means face. The preacher speaks in old Bible-style English (thou, didst, thy)."},{"t":"take counsel with my soul","c":"old","g":"Think it over seriously; consult my conscience."},{"t":"Lo","c":"old","g":"Look! Behold! (Biblical)"},{"t":"absolved","c":"old","g":"Forgiven; freed from guilt."},{"t":"Brethren","c":"old","g":"Brothers; fellow members of the church."},{"t":"execute upon him the judgment written","c":"ref","g":"Carry out on him the punishment the scriptures prescribe.","n":"Echoing Psalm 149:9: 'To execute upon them the judgment written: this honour have all his saints.'"},{"t":"exalting their pilgrim’s staves","c":"old","g":"Raising their walking sticks high.","n":"'Staves' is a plural of 'staff'."},{"t":"confluence of the multitude","c":"old","g":"The crowd surging together."},{"t":"sconces","c":"shift","g":"Heads (old slang).","m":"Usually a sconce is a wall candle-holder, but it was also joking slang for the head."},{"t":"every man’s hand was against his neighbour","c":"ref","g":"Everyone was fighting everyone.","n":"An echo of the Bible (Genesis 16:12)."},{"t":"zeal","c":"old","g":"Passionate enthusiasm, especially religious."},{"t":"lattice","c":"old","g":"A window made of small panes of glass set in a criss-cross frame."},{"t":"the blast","c":"old","g":"The gust of wind."},{"t":"unhasp the casement","c":"old","g":"Unfasten the window.","n":"A 'casement' is a window that opens on hinges like a door; a 'hasp' is its catch."},{"t":"soldered into the staple","c":"old","g":"Fixed solid with metal into the loop it should hook into.","n":"So the window can't be opened. Lockwood noticed this while awake."},{"t":"importunate","c":"old","g":"Annoyingly persistent."},{"t":"tenacious gripe","c":"old","g":"Unbreakable grip.","m":"'Gripe' is an old word for grip, not a complaint."},{"t":"lamentable prayer","c":"old","g":"Mournful pleading."},{"t":"doleful","c":"old","g":"Sorrowful."},{"t":"Begone!","c":"old","g":"Go away!"},{"t":"waif","c":"old","g":"A homeless, lost or abandoned child."},{"t":"Thereat","c":"old","g":"At that moment; thereupon."},{"t":"not ideal","c":"shift","g":"Not imaginary; real.","m":"'Ideal' here means 'existing only as an idea', not 'perfect'. His yell was real, not part of the dream."},{"t":"Heathcliff’s accents","c":"shift","g":"Heathcliff's voice and way of speaking.","m":"'Accents' means tones of voice here."},{"t":"God confound you","c":"old","g":"Damn you!"},{"t":"maxillary convulsions","c":"old","g":"Spasms of the jaw.","n":"A comically medical phrase: Heathcliff is clenching his jaw to keep control."},{"t":"richly deserves","c":"old","g":"Fully deserves."},{"t":"You have reason in shutting it up","c":"old","g":"You're right to keep it shut.","n":"Like the French 'vous avez raison'."},{"t":"akin to you","c":"old","g":"Related to you."},{"t":"minx","c": "},{"t":"impalpable ice","c":"old","g":"Ice so fine it can't be felt; the air was cold as ice."},{"t":"halloed","c":"old","g":"Shouted."},{"t":"hill-back","c":"rural","g":"The ridge or back of the hill."},{"t":"billowy","c":"old","g":"Rising and falling in waves."},{"t":"the refuse of the quarries","c":"rural","g":"Heaps of waste stone left from quarrying."},{"t":"the barren","c":"rural","g":"The bare, empty moorland."},{"t":"daubed with lime","c":"rural","g":"Smeared with white lime so they could be seen in the dark."},{"t":"a fall","c":"rural","g":"A snowfall."},{"t":"confounded","c":"old","g":"Mixed up, made impossible to tell apart."},{"t":"Thrushcross Park","c":"name","first":true,"g":"The grounds of Thrushcross Grange.","n":"The house itself is two miles inside the park gate."},{"t":"adieux","c":"old","g":"French: goodbyes."},{"t":"porter’s lodge is untenanted","c":"rural","g":"The gatekeeper's cottage is empty.","n":"Big estates had a lodge at the gate where a gatekeeper lived."},{"t":"My human fixture and her satellites","c":"old","g":"My housekeeper and the other servants around her.","n":"A callback to Chapter II, where Lockwood called the housekeeper a 'fixture' of the house."},{"t":"benumbed","c":"old","g":"Numb with cold."},{"t":"the animal heat","c":"old","g":"Body warmth."},{"t":"adjourned to my study","c":"old","g":"Moved to my study."}]},{"n":4,"roman":"IV","vol":"Volume I, Chapter IV"},{"n":5,"roman":"V","vol":"Volume I, Chapter V"},{"n":6,"roman":"VI","vol":"Volume I, Chapter VI"},{"n":7,"roman":"VII","vol":"Volume I, Chapter VII"},{"n":8,"roman":"VIII","vol":"Volume I, Chapter VIII"},{"n":9,"roman":"IX","vol":"Volume I, Chapter IX"},{"n":10,"roman":"X","vol":"Volume I, Chapter X"},{"n":11,"roman":"XI","vol":"Volume I, Chapter XI"},{"n":12,"roman":"XII","vol":"Volume I, Chapter XII"},{"n":13,"roman":"XIII","vol":"Volume I, Chapter XIII"},{"n":14,"roman":"XIV","vol":"Volume I, Chapter XIV"},{"n":15,"roman":"XV","vol":"Volume II, Chapter I"},{"n":16 const CATS = {
  shift:   { label: "Changed meaning", short: "Changed meaning" },
  old:     { label: "Old or literary word", short: "Old / literary" },
  rural:   { label: "Farm & country life", short: "Farm & country" },
  dialect: { label: "Yorkshire dialect", short: "Dialect" },
  ref:     { label: "Reference & context", short: "References" },
  name:    { label: "People & places", short: "People & places" },
};

const store = {
  get(k, d) { try { const v = localStorage.getItem("wh:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("wh:" + k, JSON.stringify(v)); } catch {} },
};

const $ = (s) => document.querySelector(s);
const reader = $("#reader"), panel = $("#panel"), card = $("#card"), items = $("#items");
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const isLetter = (ch) => !!ch && /\p{L}/u.test(ch);

const state = {
  ch: null,            // current chapter object
  order: [],           // note indices in order of first appearance
  active: null,        // active note index
  hidden: new Set(store.get("hidden", [])),
  query: "",
};

/* ---- annotate one paragraph ---- */
function annotate(raw, notes, used) {
  // strip _italic_ markers, remembering which characters were italic
  let plain = "", ital = [], on = false;
  for (const ch of raw) {
    if (ch === "_") { on = !on; continue; }
    plain += ch; ital.push(on);
  }
  // dialect passages: located by a start snippet and an end snippet
  const passes = [];
  notes.forEach((note, idx) => {
    if (!note.s || used.has(idx)) return;
    const a = plain.indexOf(note.s); if (a === -1) return;
    const b = plain.indexOf(note.e, a + note.s.length - Math.min(note.s.length, note.e.length)); if (b === -1) return;
    passes.push({ s: a, e: b + note.e.length, idx });
  });
  passes.sort((x, y) => x.s - y.s);
  const pChosen = [];
  for (const P of passes) { if (pChosen.length && P.s < pChosen[pChosen.length - 1].e) continue; pChosen.push(P); used.add(P.idx); }
  const crosses = (m) => pChosen.some((P) => m.s < P.e && m.e > P.s && !(m.s >= P.s && m.e <= P.e));

  const found = [];
  notes.forEach((note, idx) => {
    if (note.s) return;
    if (note.first && used.has(idx)) return;
    const forms = new Set([note.t]);
    const f = note.t[0];
    if (f && f.toLowerCase() !== f.toUpperCase()) forms.add((f === f.toLowerCase() ? f.toUpperCase() : f.toLowerCase()) + note.t.slice(1));
    for (const form of forms) {
      let at = plain.indexOf(form);
      while (at !== -1) {
        const end = at + form.length;
        const okStart = !isLetter(form[0]) || !isLetter(plain[at - 1]);
        const okEnd = !isLetter(form[form.length - 1]) || !isLetter(plain[end]);
        if (okStart && okEnd && !crosses({ s: at, e: end })) found.push({ s: at, e: end, idx });
        at = plain.indexOf(form, at + 1);
      }
    }
  });
  found.sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
  const chosen = [];
  let cursor = 0;
  for (const m of found) {
    if (m.s < cursor) continue;
    if (notes[m.idx].first && used.has(m.idx)) continue;
    chosen.push(m); cursor = m.e; used.add(m.idx);
  }
  const span = (a, b) => {
    let out = "", cur = false;
    for (let i = a; i < b; i++) {
      if (ital[i] !== cur) { out += ital[i] ? "<em>" : "</em>"; cur = ital[i]; }
      out += esc(plain[i]);
    }
    return out + (cur ? "</em>" : "");
  };
  const words = (a, b) => {
    let html = "", pos = a;
    for (const m of chosen) {
      if (m.s < a || m.e > b) continue;
      html += span(pos, m.s) + `<span class="w" data-n="${m.idx}" data-c="${notes[m.idx].c}" role="button" tabindex="0">${span(m.s, m.e)}</span>`;
      pos = m.e;
    }
    return html + span(pos, b);
  };
  let html = "", pos = 0;
  for (const P of pChosen) {
    html += words(pos, P.s) + `<span class="pass" data-n="${P.idx}" role="button" tabindex="0" aria-label="Show this speech in plain English">${words(P.s, P.e)}<span class="pass-mark" aria-hidden="true">in English</span></span>`;
    pos = P.e;
  }
  html += words(pos, plain.length);
  const hits = [...pChosen, ...chosen].sort((x, y) => x.s - y.s || (y.e - y.s) - (x.e - x.s)).map((m) => m.idx);
  return { html, hits };
}

/* ---- chapter rendering ---- */
function renderChapter(n) {
  const ch = CHAPTERS.find((c) => c.n === n) || CHAPTERS[0];
  state.ch = ch; state.active = null; state.order = [];
  store.set("chapter", ch.n);
  $("#chapter").value = String(ch.n);
  if (location.hash !== "#chapter-" + ch.n) history.replaceState(null, "", "#chapter-" + ch.n);

  const head = `<header class="chap-head"><h1><small>Chapter</small>${ch.roman}</h1>${ch.n > 14 ? `<div class="vol">Volume II, Chapter ${ch.vol.split(" ").pop()} in two-volume editions</div>` : ""}</header>`;
  if (!ch.paras) {
    reader.innerHTML = head + `<p class="empty">Chapter ${ch.roman} hasn't been annotated yet.<br>Chapters ready so far: ${CHAPTERS.filter((c) => c.paras).map((c) => c.roman).join(", ")}.</p>` + navHTML(ch);
    renderList(); renderCard(); return;
  }
  const used = new Set(), seen = new Set();
  const paras = ch.paras.map((p, i) => {
    if (/^(\*\s*)+$/.test(p)) return `<p class="break" aria-hidden="true">* * *</p>`;
    const r = annotate(p, ch.notes, used);
    r.hits.forEach((i) => { if (!seen.has(i)) { seen.add(i); state.order.push(i); } });
    return `<p${i === 0 && /^\p{L}/u.test(p) ? ' class="dropcap"' : ""}>${r.html}</p>`;
  }).join("");
  const missing = ch.notes.map((_, i) => i).filter((i) => !seen.has(i));
  if (missing.length) console.warn("Notes not matched in text:", missing.map((i) => ch.notes[i].t));
  const orient = ch.orient ? `<dl class="orient"><dt>Where we are</dt><dd>${esc(ch.orient)}</dd></dl>` : "";
  reader.innerHTML = head + orient + `<div class="text" id="text">${paras}</div>` + navHTML(ch) +
    `<p class="source">Text: Project Gutenberg eBook #768 (public domain). Notes written for this companion.</p>`;
  applyHidden(); applyPlain();
  renderList(); renderCard();
  window.scrollTo({ top: 0 });
}

function navHTML(ch) {
  const prev = CHAPTERS.find((c) => c.n === ch.n - 1), next = CHAPTERS.find((c) => c.n === ch.n + 1);
  return `<nav class="chap-nav">${prev ? `<button class="btn" type="button" data-go="${prev.n}">← Chapter ${prev.roman}</button>` : "<span></span>"}` +
    `${next ? `<button class="btn" type="button" data-go="${next.n}">Chapter ${next.roman} →</button>` : "<span></span>"}</nav>`;
}

/* ---- notes card ---- */
function renderCard() {
  const ch = state.ch;
  if (state.active == null || !ch.notes) {
    card.innerHTML = `<p class="hint"><b>Tap any underlined word</b> to see what it means here. The underline style shows the kind of note: <span style="text-decoration:underline wavy var(--c-shift);text-underline-offset:.2em">wavy</span> means the word has changed meaning since 1847. <span style="background:color-mix(in srgb,var(--c-dialect) 14%,transparent);padding:0 .2em;border-radius:3px">Shaded speeches</span> are in Yorkshire dialect: tap one to read it in plain English.</p>`;
    return;
  }
  const note = ch.notes[state.active];
  const pos = state.order.indexOf(state.active);
  const navRow = `
    <div class="note-nav">
      <button class="btn" type="button" data-step="-1" ${pos <= 0 ? "disabled" : ""}>← Previous</button>
      <span class="count">${pos + 1} of ${state.order.length}</span>
      <button class="btn" type="button" data-step="1" ${pos >= state.order.length - 1 ? "disabled" : ""}>Next →</button>
    </div>`;
  if (note.s) {
    card.innerHTML = `
      <div class="note-top">
        <span class="chip" data-c="dialect">Dialect speech in plain English</span>
        <button class="close" type="button" data-close aria-label="Close note">×</button>
      </div>
      <h2 class="note-word quote">${note.who ? `<b>${esc(note.who)}:</b> ` : ""}“${esc(note.s.replace(/^[“‘]+/, ""))}…”</h2>
      <p class="note-gloss">${esc(note.tr)}</p>
      ${note.n ? `<p class="note-more">${esc(note.n)}</p>` : ""}${navRow}`;
    return;
  }
  card.innerHTML = `
    <div class="note-top">
      <span class="chip" data-c="${note.c}">${CATS[note.c]?.label || note.c}</span>
      <button class="close" type="button" data-close aria-label="Close note">×</button>
    </div>
    <h2 class="note-word">${esc(note.t.replace(/[“”]/g, ""))}</h2>
    <p class="note-gloss">${esc(note.g)}</p>
    ${note.m ? `<p class="note-modern"><b>Watch out:</b> ${esc(note.m)}</p>` : ""}
    ${note.n ? `<p class="note-more">${esc(note.n)}</p>` : ""}
    <div class="note-nav">
      <button class="btn" type="button" data-step="-1" ${pos <= 0 ? "disabled" : ""}>← Previous</button>
      <span class="count">${pos + 1} of ${state.order.length}</span>
      <button class="btn" type="button" data-step="1" ${pos >= state.order.length - 1 ? "disabled" : ""}>Next →</button>
    </div>`;
}

function activate(idx, { scroll = false, open = true } = {}) {
  state.active = idx;
  document.querySelectorAll("#text .active").forEach((el) => el.classList.remove("active"));
  const els = document.querySelectorAll(`#text [data-n="${idx}"]`);
  els.forEach((el) => el.classList.add("active"));
  if (scroll && els[0]) {
    els[0].scrollIntoView({ block: matchMedia("(max-width: 900px)").matches ? "start" : "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    els[0].classList.remove("flash"); void els[0].offsetWidth; els[0].classList.add("flash");
  }
  renderCard(); markListActive();
  if (open) { panel.dataset.mode = "note"; panel.classList.add("open"); }
}

/* ---- word list ---- */
function renderFilters() {
  const ch = state.ch;
  const counts = {};
  (ch.notes || []).forEach((n, i) => { if (state.order.includes(i)) counts[n.c] = (counts[n.c] || 0) + 1; });
  $("#filters").innerHTML = Object.entries(CATS).map(([k, v]) =>
    `<button class="filter" type="button" data-c="${k}" data-filter="${k}" aria-pressed="${!state.hidden.has(k)}">${v.short} <em>${counts[k] || 0}</em></button>`).join("");
}

function renderList() {
  renderFilters();
  const ch = state.ch;
  if (!ch.notes) { items.innerHTML = `<li class="none">No notes for this chapter yet.</li>`; $("#listCount").textContent = ""; return; }
  const q = state.query.trim().toLowerCase();
  const shown = state.order.filter((i) => {
    const n = ch.notes[i];
    if (state.hidden.has(n.c)) return false;
    if (!q) return true;
    return [n.t, n.g, n.m, n.n, n.s, n.tr, n.who].some((s) => s && s.toLowerCase().includes(q));
  });
  $("#listCount").textContent = `${shown.length} of ${state.order.length}`;
  items.innerHTML = shown.length ? shown.map((i) => {
    const n = ch.notes[i];
    const label = n.s ? `${n.who ? n.who + ": " : ""}“${n.s.replace(/^[“‘]+/, "")}…”` : n.t.replace(/[“”]/g, "");
    return `<li><button type="button" data-c="${n.c}" data-jump="${i}"><i></i><b>${esc(label)}</b><span>${esc(n.s ? n.tr : n.g)}</span></button></li>`;
  }).join("") : `<li class="none">Nothing matches.</li>`;
  markListActive();
}

function markListActive() {
  items.querySelectorAll("button.active").forEach((b) => b.classList.remove("active"));
  const b = items.querySelector(`button[data-jump="${state.active}"]`);
  if (b) { b.classList.add("active"); if (matchMedia("(min-width: 901px)").matches) b.scrollIntoView({ block: "nearest" }); }
}

function applyHidden() {
  const t = $("#text"); if (!t) return;
  Object.keys(CATS).forEach((k) => t.classList.toggle("hide-" + k, state.hidden.has(k)));
}
function applyPlain() {
  const on = store.get("plain", false);
  $("#plainBtn").setAttribute("aria-pressed", String(on));
  const t = $("#text"); if (t) t.classList.toggle("plain", on);
}

/* ---- text size ---- */
let size = store.get("size", 1.125);
function applySize() { document.documentElement.style.setProperty("--text-size", size + "rem"); store.set("size", size); }

/* ---- events ---- */
document.addEventListener("click", (e) => {
  const w = e.target.closest(".w");
  if (w) {
    const t = $("#text");
    if (t && t.classList.contains("hide-" + w.dataset.c)) return;
    activate(+w.dataset.n); return;
  }
  const ps = e.target.closest(".pass");
  if (ps) {
    const t = $("#text");
    if (t && t.classList.contains("hide-dialect")) return;
    activate(+ps.dataset.n); return;
  }
  const go = e.target.closest("[data-go]"); if (go) { renderChapter(+go.dataset.go); return; }
  const step = e.target.closest("[data-step]");
  if (step) { const pos = state.order.indexOf(state.active) + +step.dataset.step; if (state.order[pos] != null) activate(state.order[pos], { scroll: true }); return; }
  const jump = e.target.closest("[data-jump]");
  if (jump) { activate(+jump.dataset.jump, { scroll: true }); return; }
  const f = e.target.closest("[data-filter]");
  if (f) {
    const k = f.dataset.filter;
    state.hidden.has(k) ? state.hidden.delete(k) : state.hidden.add(k);
    store.set("hidden", [...state.hidden]); applyHidden(); renderList(); return;
  }
  if (e.target.closest("[data-close]")) { panel.classList.remove("open"); return; }
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && (e.target.classList?.contains("w") || e.target.classList?.contains("pass"))) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape") panel.classList.remove("open");
});
$("#chapter").addEventListener("change", (e) => renderChapter(+e.target.value));
$("#search").addEventListener("input", (e) => { state.query = e.target.value; renderList(); });
$("#listBtn").addEventListener("click", () => {
  const showing = panel.classList.contains("open") && panel.dataset.mode === "list";
  panel.dataset.mode = "list"; panel.classList.toggle("open", !showing);
});
$("#plainBtn").addEventListener("click", () => { store.set("plain", !store.get("plain", false)); applyPlain(); });
$("#smaller").addEventListener("click", () => { size = Math.max(.9, +(size - .0625).toFixed(4)); applySize(); });
$("#larger").addEventListener("click", () => { size = Math.min(1.6, +(size + .0625).toFixed(4)); applySize(); });
window.addEventListener("hashchange", () => { const m = location.hash.match(/^#chapter-(\d+)$/); if (m && +m[1] !== state.ch?.n) renderChapter(+m[1]); });

/* ---- boot ---- */
$("#chapter").innerHTML = CHAPTERS.map((c) => `<option value="${c.n}" ${c.paras ? "" : "disabled"}>Chapter ${c.roman}${c.paras ? "" : " · coming"}</option>`).join("");
applySize();
const fromHash = location.hash.match(/^#chapter-(\d+)$/);
const firstReady = (CHAPTERS.find((c) => c.paras) || CHAPTERS[0]).n;
let startN = fromHash ? +fromHash[1] : store.get("chapter", firstReady);
if (!CHAPTERS.find((c) => c.n === startN && c.paras)) startN = firstReady;
renderChapter(startN);
</script>
