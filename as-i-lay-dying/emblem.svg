<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <defs><clipPath id="aild-box"><path d="M37 8 H63 L74 40 L67 132 H33 L26 40 Z"/></clipPath></defs>
  <!-- the box: Cash's coffin, as a frame -->
  <path d="M34 4 H66 L78 40 L70 136 H30 L22 40 Z" stroke-width="1.3"/>
  <path d="M37 8 H63 L74 40 L67 132 H33 L26 40 Z" stroke-width="0.6" opacity=".6"/>
  <g clip-path="url(#aild-box)">
    <!-- sky: a buzzard turning, and another far off -->
    <path d="M44 30 q3 -3.2 6 -.6 q3 -2.6 6 .6" stroke-width="1.1"/>
    <path d="M57 21 q1.6 -1.7 3.2 -.3 q1.6 -1.4 3.2 .3" stroke-width="0.8" opacity=".7"/>
    <!-- low sun -->
    <path d="M57 66 a6 6 0 0 1 12 0" stroke-width="0.9" opacity=".75"/>
    <!-- horizon and the town far off: the courthouse at Jefferson -->
    <path d="M20 66 H80" stroke-width="1.1"/>
    <path d="M46.5 66 V62.5 H53.5 V66" stroke-width="0.9"/>
    <path d="M48 62.5 Q50 58.6 52 62.5 M50 58.8 V57" stroke-width="0.9"/>
    <!-- fields falling away either side of the road -->
    <path d="M20 74 L45 67 M20 84 L43 68 M80 74 L55 67 M80 84 L57 68" stroke-width="0.6" opacity=".45"/>
    <!-- the road to town -->
    <path d="M36 136 L48.6 66.5 M64 136 L51.4 66.5" stroke-width="1.1"/>
    <!-- the wagon, seen from behind, with the box on its bed -->
    <path d="M47.5 95 L48.6 89 M52.5 95 L51.4 89" stroke-width="0.8"/>
    <path d="M47.6 89 h4.8 v-3.2 h-4.8 z" stroke-width="0.8"/>
    <path d="M41.5 103 H58.5 V97 H41.5 Z" stroke-width="1.2"/>
    <path d="M44 97 L45 94.5 H55 L56 97" stroke-width="1"/>
    <circle cx="41" cy="105" r="4.4" stroke-width="1.2"/>
    <circle cx="59" cy="105" r="4.4" stroke-width="1.2"/>
    <path d="M41 100.6 V109.4 M36.6 105 H45.4 M59 100.6 V109.4 M54.6 105 H63.4" stroke-width="0.5" opacity=".7"/>
  </g>
</svg>
